name: Verificar resultados de QA
on: [push, pull_request, workflow_dispatch]
jobs:
  numerical-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify_artifact.py
